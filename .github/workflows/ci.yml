# GitHub Actions CI Workflow — Module 1: CI/CD Pipeline
# Runs on every push and pull request to main/develop branches

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: TypeScript type check
        working-directory: backend
        run: npm run typecheck

      - name: Push test database schema
        working-directory: backend
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: file:./test.db

      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: file:./test.db
          JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
          NODE_ENV: test
          UPLOAD_DIR: ./test_uploads

      - name: Build backend
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend — Typecheck, Test, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t legal-doc-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t legal-doc-frontend ./frontend
